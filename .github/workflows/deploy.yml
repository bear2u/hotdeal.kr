name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 매일 00:05 KST — 새 데이터가 없어도 "어제 기준"·지난 글 안내가 날짜에 맞게 바뀌도록 다시 빌드
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # 데이터에 문제가 있으면(링크 누락 등) 여기서 멈춰 배포되지 않는다
      - run: npm test

      - run: npm run build
        env:
          # 커스텀 도메인 연결 전: /hotdeal.kr, 연결 후: 빈 값 — configure-pages 가 자동으로 알려준다
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
